spring:
  application:
    name: legado
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/legado_db?sslmode=disable}
    username: ${DATASOURCE_USERNAME:app}
    password: ${DATASOURCE_PASSWORD:app}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
