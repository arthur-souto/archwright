name: Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  installer:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, label: macos-arm64 }
          - { runner: macos-15-intel, label: macos-x64 }
          - { runner: windows-latest, label: windows-x64 }
          - { runner: ubuntu-latest, label: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Gerar o instalador
        shell: bash
        run: ./mvnw -B -Pinstaller -pl archwright-desktop -am package -DskipTests
      - name: Nomear o arquivo pela plataforma
        shell: bash
        working-directory: archwright-desktop/target/installer/dist
        run: |
          for file in *; do
            mv "$file" "${file%.*}-${{ matrix.label }}.${file##*.}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: archwright-${{ matrix.label }}
          path: archwright-desktop/target/installer/dist/*
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: |
            **Pré-lançamento.** Os instaladores ainda não são assinados: o macOS e o Windows mostram um aviso de app não verificado na primeira abertura. O passo a passo está no [INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALL.md).

            A versão do Archwright é a desta tag. Os arquivos têm `1.0.0` no nome porque o macOS recusa instaladores com versão começando em 0; é só o número do instalador.
        run: gh release create "${{ github.ref_name }}" installers/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --prerelease --notes "$NOTES" --generate-notes
