name: Generated projects

on:
  pull_request:
    paths:
      - 'archwright-engine/src/main/resources/archwright/**'
      - 'archwright-engine/src/test/java/io/github/arthursouto/archwright/engine/matrix/**'
      - '.github/workflows/generated-projects.yml'
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.descriptor.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Gerar os projetos da matriz
        run: ./mvnw -B -pl archwright-engine test -Dtest=CompilationMatrixTest -Dmatrix.output="$RUNNER_TEMP/matrix"
      - id: descriptor
        run: echo "matrix=$(cat "$RUNNER_TEMP/matrix/matrix.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: generated-projects
          path: ${{ runner.temp }}/matrix
          include-hidden-files: true
          retention-days: 3

  verify:
    needs: generate
    runs-on: ubuntu-latest
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate.outputs.matrix) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: generated-projects
          path: generated
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdk }}
          cache: maven
          cache-dependency-path: generated/${{ matrix.name }}/matrix-app/pom.xml
      - name: Baixar o Maven (com tentativas e espelhos)
        working-directory: generated/${{ matrix.name }}/matrix-app
        run: |
          chmod +x mvnw
          # O wrapper aceita MVNW_REPOURL; alterna entre o Maven Central e espelhos
          # porque, quando o runner não alcança um host, esperar não resolve.
          mirrors=(
            "https://repo.maven.apache.org/maven2"
            "https://repo1.maven.org/maven2"
            "https://maven-central.storage-download.googleapis.com/maven2"
          )
          max_attempts=6
          for attempt in $(seq 1 $max_attempts); do
            mirror="${mirrors[$(( (attempt - 1) % ${#mirrors[@]} ))]}"
            MVNW_REPOURL="$mirror" ./mvnw -B -v && exit 0
            echo "Download do Maven falhou em $mirror (tentativa $attempt de $max_attempts)"
            if [ "$attempt" -lt "$max_attempts" ]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Build e fitness functions do projeto gerado
        working-directory: generated/${{ matrix.name }}/matrix-app
        run: ./mvnw -B verify
