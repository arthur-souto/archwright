dependencies.title=Dependências e fitness functions
dependencies.kit=Kit
dependencies.kit.help=Conjunto inicial de dependências. O Básico marca Web, Validation, Actuator, JPA com PostgreSQL, Flyway e Lombok; o Nenhum começa vazio. Você pode ajustar na lista abaixo.
dependencies.extras=Extras
dependencies.extras.help=Arquivos opcionais gerados junto com o projeto. Alguns só ficam disponíveis com certa dependência marcada.
extra.docker-compose.help=Sobe o PostgreSQL local para o projeto. Exige a dependência JPA com PostgreSQL.
extra.docker-compose.files=Gera: docker-compose.yml e .env.example
extra.github-actions.help=Workflow que roda o build e as regras de arquitetura a cada push e pull request.
extra.github-actions.files=Gera: .github/workflows/ci.yml
dependencies.kit.marks=Marca: {value}.
dependencies.kit.empty=Não marca nenhuma dependência; você escolhe tudo na lista abaixo.
dependencies.artifact=Maven: {value}
dependencies.implies=Inclui: {value}
dependencies.fitness=Gerar fitness functions (ArchUnit)
dependencies.fitness.help=Testes de arquitetura que rodam no mvn verify e no CI e quebram o build se alguém violar as regras abaixo.
dependencies.fitness.rules=Regras que serão aplicadas
rule.FF-LAY-01.help=Garante o sentido da dependência: o domínio não conhece a aplicação, e a aplicação não conhece a infraestrutura. É o que mantém a arquitetura em camadas de pé.
rule.FF-LAY-02.help=Ciclos entre os pacotes de primeiro nível (domain, application, infrastructure) deixam o código difícil de separar e de testar.
rule.FF-DOM-01.help=Mantém o domínio em Java puro, para testar as regras de negócio sem subir framework nenhum.
rule.FF-PRT-01.help=As portas são contratos; só interfaces nelas deixa claro o que a aplicação oferece e o que ela precisa.
rule.FF-PRT-02.help=Impede que adapters ou outras classes implementem uma porta de entrada: quem a implementa é o caso de uso.
rule.FF-ADP-01.help=Um adapter de entrada (como o HTTP) nunca chama um de saída (como o banco) direto; o caminho passa pela aplicação.
rule.FF-ADP-02.help=Mantém todos os controllers num só lugar, em adapter.in, para achar e revisar a API com facilidade.
rule.FF-ADP-03.help=O controller chama só as portas de entrada, assim a regra de negócio não vaza para a camada web.
rule.FF-PER-01.help=As entidades JPA ficam isoladas no pacote de persistência e não se misturam com o modelo de domínio.
rule.FF-PER-02.help=Os repositórios Spring Data ficam na persistência; o resto do código só os enxerga pelas portas de saída.
rule.FF-MOD-01.help=Módulos conversam só pela porta de entrada e pelo domínio uns dos outros, sem acessar detalhes internos.
rule.FF-MOD-02.help=O shared kernel é a base comum; se ele dependesse de um módulo, criaria uma dependência circular escondida.
rule.FF-MOD-03.help=Ciclos entre módulos impedem separar um módulo depois, por exemplo em outro serviço.
rule.FF-COD-01.help=A injeção por construtor deixa as dependências explícitas e permite testar sem container.
rule.FF-COD-02.help=Domínio e aplicação não ficam presos ao Spring; os beans são declarados na configuração.
rule.FF-COD-03.help=Use um logger em vez de imprimir no console, para o log poder ser filtrado e coletado.

