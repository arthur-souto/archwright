tip.fitness.title=O que são fitness functions?
tip.fitness.text=São testes de arquitetura (ArchUnit) gerados dentro do projeto. Eles quebram o build quando alguém viola uma regra, como um controller acessando um repositório.
tip.styles.title=Modular ou em camadas?
tip.styles.text=O modular separa o sistema em módulos, cada um com sua hexagonal, e serve para um monólito que pode crescer. O em camadas é uma hexagonal só, mais simples para uma API menor.
