about.description=O Archwright gera projetos Spring Boot com arquitetura hexagonal e fitness functions, tudo no seu computador. Escolha o estilo, as versões e as dependências, e receba um ZIP ou uma pasta que já compila.
about.license=Licença Apache 2.0.
about.trademark=Spring e Spring Boot são marcas registradas da Broadcom Inc. O Archwright é um projeto independente, sem vínculo com o projeto Spring.

